services:
  postgres:
    image: postgres:17-alpine
    container_name: schemabridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schemabridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/api.Dockerfile
    container_name: schemabridge-api
    restart: unless-stopped
    environment:
      SCHEMABRIDGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCHEMABRIDGE_STORAGE_ROOT: /app/data/uploads
      SCHEMABRIDGE_FRONTEND_ORIGIN: http://localhost:3000
      SCHEMABRIDGE_JWT_SECRET: ${SCHEMABRIDGE_JWT_SECRET:-development-only-change-me}
      SCHEMABRIDGE_JWT_ACCESS_TOKEN_MINUTES: ${SCHEMABRIDGE_JWT_ACCESS_TOKEN_MINUTES:-60}
      SCHEMABRIDGE_AI_API_KEY: ${SCHEMABRIDGE_AI_API_KEY}
      SCHEMABRIDGE_AI_BASE_URL: ${SCHEMABRIDGE_AI_BASE_URL}
      SCHEMABRIDGE_AI_MODEL: ${SCHEMABRIDGE_AI_MODEL}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - schemabridge_upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deployment/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: schemabridge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  schemabridge_postgres_data:
  schemabridge_upload_data:
