services:
  postgres:
    image: postgres:17-alpine
    container_name: schemabridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schemabridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployment/api.Dockerfile
    container_name: schemabridge-api
    restart: unless-stopped
    environment:
      SCHEMABRIDGE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCHEMABRIDGE_STORAGE_ROOT: /app/data/uploads
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - schemabridge_upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  schemabridge_postgres_data:
  schemabridge_upload_data:
